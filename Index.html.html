
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silsilah Keluarga</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #17263e;
      background: linear-gradient(135deg, #eaf0ff, #f8fafc);
    }
    .card {
      width: 100%;
      max-width: 520px;
      padding: 38px 28px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 16px 50px #15223818;
    }
    .logo { font-size: 54px; }
    h1 { margin-bottom: 12px; }
    p { line-height: 1.7; color: #667085; }
    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 24px;
      border-radius: 12px;
      color: white;
      background: #3867d6;
      font-weight: bold;
      text-decoration: none;
    }
    .button:hover { background: #2852b5; }
    small { display: block; margin-top: 22px; color: #667085; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🌳</div>
    <h1>Silsilah Keluarga</h1>
    <p>
      Dokumentasikan anggota keluarga, hubungan
      kekerabatan, dan perjalanan keluarga lintas generasi.
    </p>

    <a class="button"
       href="https://script.google.com/macros/s/AKfycbzM4amQMo7Rh1axohmFB0E8Hc7lMRziU-fxoriLIJHSJ2pkMXoTzGmfwR75igTSVtS7/exec"
       target="_blank"
       rel="noopener noreferrer">
      Buka Aplikasi
    </a>

    <small>Family Tree Management</small>
  </main>
</body>
</html>
